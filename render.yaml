services:
  # Backend: SL-Meet Socket & Signaling Server
  - type: web
    name: sl-meet-server
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: ADMIN_SECRET
        value: sl_meet_admin_secret_2026
      - key: CLIENT_URL
        value: "*"
    healthCheckPath: /health

  # Frontend: SL-Meet React Vite SPA
  - type: web
    name: sl-meet-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: sl-meet-server
          property: host
